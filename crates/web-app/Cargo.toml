[package]
name = "paper-immersive-reader-web-app"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "web-app-bin"
path = "src/main.rs"

[dependencies]
paper-immersive-reader-core = { path = "../core" }
paper-immersive-reader-importing = { path = "../importing", optional = true }
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement",
  "HtmlTextAreaElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlAnchorElement",
  "File", "FileList", "FileReader", "Blob",
  "Selection", "Range", "StaticRange",
  "IdbDatabase", "IdbFactory", "IdbOpenDbRequest", "IdbRequest",
  "IdbTransaction", "IdbTransactionMode", "IdbObjectStore",
  "IdbIndex", "IdbKeyRange", "IdbCursorWithValue",
  "IdbVersionChangeEvent", "DomStringList",
  "Url",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "js"] }
gloo-net = { version = "0.6", features = ["http", "json"] }

[features]
default = []
native-import = ["dep:paper-immersive-reader-importing"]
