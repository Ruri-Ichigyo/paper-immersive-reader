[package]
name = "paper-immersive-reader-web-app"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
paper-immersive-reader-core = { path = "../core" }
paper-immersive-reader-importing = { path = "../importing" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement",
  "IdbDatabase", "IdbFactory", "IdbOpenDbRequest", "IdbRequest",
  "IdbTransaction", "IdbTransactionMode", "IdbObjectStore",
  "IdbIndex", "IdbKeyRange", "IdbCursorWithValue",
  "IdbVersionChangeEvent",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
gloo-net = { version = "0.6", features = ["http"] }
