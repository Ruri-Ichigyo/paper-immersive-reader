[package]
name = "paper-immersive-reader-web-app"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
paper-immersive-reader-core = { path = "../core" }
paper-immersive-reader-importing = { path = "../importing" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
